<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Clinical AI EHR</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Removing old container padding for split layout */
        body,
        html {
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            padding: 3rem;
            text-align: center;
            border-radius: var(--radius-xl);
            color: #ffffff; /* Light text for dark background */
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            padding-left: 0.5rem;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 1rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 4px var(--primary-light);
            outline: none;
        }
        
        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .auth-btn {
            width: 100%;
            margin-top: 1.5rem;
            justify-content: center;
            padding: 0.8rem;
            font-size: 1.1rem;
        }

        .toggle-text {
            margin-top: 1.5rem;
            font-size: 0.95rem;
            color: var(--primary-color);
            cursor: pointer;
            font-weight: 500;
        }

        .toggle-text:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        #auth-message {
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .error {
            color: var(--danger-color);
        }

        .success {
            color: #34c759;
        }

        .signup-only {
            display: none;
        }
    </style>
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>
    <!-- Splash Screen Overlay -->
    <div id="splash-screen">
        <div class="splash-logo-container">
            <div class="splash-swirl"></div>
            <img src="logo.png?v=2" alt="Clinical AI Logo">
        </div>
    </div>

    <!-- Split Screen Layout -->
    <div class="login-split">
        <!-- Left Branding Side -->
        <div class="login-left">
            <img src="logo.png?v=2" alt="Logo"
                style="width: 120px; height: 120px; border-radius: 50%; box-shadow: 0 8px 30px rgba(0,0,0,0.3); margin-bottom: 2rem; background-color: transparent; object-fit: contain;">
            <h1
                style="font-size: 3.5rem; line-height: 1.1; margin-bottom: 1rem; text-shadow: 0 4px 10px rgba(0,0,0,0.2);">
                Clinical AI EHR</h1>
            <p style="font-size: 1.25rem; opacity: 0.9; max-width: 80%; line-height: 1.6;">
                The future of intelligent medical scribing and clinical decision support. Empowering doctors with
                hands-free documentation and instant, evidence-based insights.
            </p>
        </div>

        <!-- Right Action Side -->
        <div class="login-right">
            <div class="panel glass-panel auth-container" style="height: auto;">
                <h2 id="form-title" style="font-size: 1.8rem; margin-bottom: 1.5rem;">Welcome Back</h2>

                <div id="auth-message"></div>

                <div class="form-group signup-only">
                    <label>First Name</label>
                    <input type="text" id="first_name" placeholder="Enter your first name">
                </div>

                <div class="form-group signup-only">
                    <label>Last Name</label>
                    <input type="text" id="last_name" placeholder="Enter your last name">
                </div>

                <div class="form-group signup-only">
                    <label>ID Number</label>
                    <input type="text" id="id_number" placeholder="Enter your Professional ID">
                </div>

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Enter your username">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                </div>

                <button id="submit-btn" class="btn btn-primary auth-btn">Login</button>

                <p class="toggle-text" id="toggle-reset" style="margin-top: 1rem;">Forgot Password?</p>
                <p class="toggle-text" id="toggle-mode">Don't have an account? Sign up (Doctors only)</p>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
    <script>
        // Splash Screen Logic
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
                setTimeout(() => {
                    if (splash.parentNode) {
                        splash.parentNode.removeChild(splash);
                    }
                }, 800); // Wait for transition to complete before removing from DOM
            }, 2500); // Display splash for 2.5 seconds
        });
    </script>
</body>

</html>
