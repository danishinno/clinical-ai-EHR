<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings - Health Sync</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .profile-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
        }
        .form-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .form-group {
            flex: 1;
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 1rem;
        }
        .form-group input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.2);
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        #profile-message {
            margin-bottom: 1rem;
            font-weight: 500;
        }
        .error { color: var(--danger-color); }
        .success { color: #34c759; }
    </style>
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <div class="container">
        <div class="header-top">
            <div style="display: flex; align-items: center; gap: 15px;">
                <img src="logo.png" alt="Logo" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; box-shadow: 0 2px 5px rgba(0,0,0,0.1); background-color: white;">
                <h1 style="margin: 0;">⚙️ Profile Settings</h1>
            </div>
            <button id="back-btn" class="btn btn-secondary">Back to Dashboard</button>
        </div>

        <div class="panel glass-panel profile-container" style="height: auto;">
            <div id="profile-message"></div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="first_name" placeholder="First Name">
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="last_name" placeholder="Last Name">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>ID Number</label>
                    <input type="text" id="id_number" placeholder="Professional ID">
                </div>
                <div class="form-group">
                    <label>Specialty</label>
                    <input type="text" id="specialty" placeholder="e.g. Cardiology">
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 1.5rem 0;">

            <div class="form-group">
                <label>Username (Login ID)</label>
                <input type="text" id="username" placeholder="Username">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Password">
            </div>

            <button id="save-btn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Save Changes</button>
        </div>
    </div>
    <script src="profile.js"></script>
</body>
</html>
